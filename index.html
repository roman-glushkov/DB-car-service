<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoPro — рабочее место автосервиса</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">A</div>
          <div><strong>AutoPro</strong><span>service desk</span></div>
        </div>

        <div class="side-label">РАБОЧИЙ СТОЛ</div>
        <nav>
          <button class="nav-item active" data-page="dashboard">
            <i>⌂</i><span>Главная</span>
          </button>
          <button class="nav-item" data-page="orders">
            <i>▤</i><span>Заказы</span><b>12</b>
          </button>
          <button class="nav-item" data-page="clients">
            <i>♙</i><span>Клиенты</span>
          </button>
          <button class="nav-item" data-page="cars">
            <i>▣</i><span>Машины</span>
          </button>
        </nav>

        <div class="side-label">УЧЁТ</div>
        <nav>
          <button class="nav-item" data-page="employees">
            <i>♙</i><span>Сотрудники</span>
          </button>
          <button class="nav-item" data-page="works">
            <i>◒</i><span>Работы</span>
          </button>
          <button class="nav-item" data-page="parts">
            <i>◇</i><span>Запчасти</span><b class="warn">4</b>
          </button>
          <button class="nav-item" data-page="payments">
            <i>₽</i><span>Оплаты</span>
          </button>
        </nav>

        <div class="side-label">АНАЛИТИКА</div>
        <nav>
          <button class="nav-item" data-page="stats">
            <i>↗</i><span>Статистика</span>
          </button>
        </nav>

        <div class="side-bottom">
          <div class="mini-photo"></div>
          <div><strong>Алексей Петров</strong><span>Администратор</span></div>
          <button class="more">•••</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="mobile-menu" id="menuBtn">☰</button>
          <div class="breadcrumbs">
            <span>AutoPro</span><b>/</b><strong id="pageTitle">Главная</strong>
          </div>
          <div class="top-actions">
            <button class="icon-btn" title="Уведомления">♢<em></em></button>
            <div class="date">Пн, 28 сентября 2026</div>
            <button class="avatar">АП</button>
          </div>
        </header>

        <div id="content"></div>
      </main>
    </div>

    <div class="modal" id="modal">
      <div class="modal-card">
        <button class="modal-close" id="modalClose">×</button>
        <div id="modalBody"></div>
      </div>
    </div>
    <div class="toast" id="toast">Изменения сохранены</div>
    <script src="script.js"></script>
  </body>
</html>
