<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoPro — рабочее место автосервиса</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-api-scope="admin">
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">A</div>
          <div><strong>AutoPro</strong><span>service desk</span></div>
        </div>
        <nav>
          <button class="nav-item active" data-page="orders">
            <i>▤</i><span>Заказы</span>
          </button>
          <button class="nav-item" data-page="clients">
            <i>♙</i><span>Клиенты</span>
          </button>
          <button class="nav-item" data-page="cars">
            <i>▣</i><span>Машины</span>
          </button>
          <button class="nav-item" data-page="employees">
            <i>♙</i><span>Сотрудники</span>
          </button>
          <button class="nav-item" data-page="works">
            <i>◒</i><span>Работы</span>
          </button>
          <button class="nav-item" data-page="parts">
            <i>◇</i><span>Запчасти</span>
          </button>
          <button class="nav-item" data-page="payments">
            <i>₽</i><span>Оплаты</span>
          </button>
          <button class="nav-item" data-page="accounts">
            <i>♙</i><span>Доступы пользователей</span>
          </button>
        </nav>
        <div class="sidebar-bottom">
          <button class="sidebar-settings" id="settingsBtn" type="button">
            <span>⚙</span>Настройки
          </button>
          <button class="sidebar-logout" id="logoutBtn" type="button">
            <span>↗</span>Выйти
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="mobile-menu" id="menuBtn">☰</button>
          <div></div>
          <div class="top-actions">
            <button class="icon-btn" title="Уведомления">♢<em></em></button>
            <div class="date" id="currentDate"></div>
            <div
              class="avatar"
              id="topAvatar"
              title="Профиль администратора"
              aria-label="Профиль"
            >
              АП
            </div>
          </div>
        </header>

        <div id="content"></div>
      </main>
    </div>

    <script src="/js/common/api.js"></script>
    <script src="/js/admin/ui.js"></script>
    <script src="/js/admin/orders.js"></script>
    <script src="/js/admin/order-modal.js"></script>
    <script src="/js/admin/clients.js"></script>
    <script src="/js/admin/cars.js"></script>
    <script src="/js/admin/employees.js"></script>
    <script src="/js/admin/works.js"></script>
    <script src="/js/admin/parts.js"></script>
    <script src="/js/admin/payments.js"></script>
    <script src="/js/admin/accounts.js"></script>
    <script src="/js/admin/filters.js"></script>
    <script src="/js/admin/settings.js"></script>
    <script src="/js/admin/records.js"></script>
    <script src="/js/admin/main.js"></script>
      <script src="/js/common/photo-fallback.js"></script>
  </body>
</html>
